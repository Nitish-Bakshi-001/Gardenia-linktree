<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Gardenias | Amritsar</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F2EBE0;
  --card:#D9C4AC;
  --card-hover:#CCAF94;
  --ink:#2A1F14;
  --ink-soft:#7A6050;
  --ink-faint:#A8927A;
  --gold:#B8895A;
  --white:#FDF8F3;
  --line:rgba(184,137,90,0.32);
}
html{background:var(--bg)}
body{
  font-family:'DM Sans',sans-serif;
  background:
    radial-gradient(ellipse 85% 50% at 50% -8%,rgba(184,137,90,0.12) 0%,transparent 60%),
    radial-gradient(ellipse 65% 42% at 82% 104%,rgba(160,100,60,0.09) 0%,transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  min-height:100vh;
  display:flex;justify-content:center;
}
.page{
  width:100%;max-width:430px;
  padding:52px 24px 60px;
  display:flex;flex-direction:column;align-items:center;
}
/* LOGO */
.logo-wrap{
  width:120px;height:120px;
  border-radius:24px;overflow:hidden;
  border:1.5px solid var(--line);
  box-shadow:0 10px 32px rgba(100,60,20,0.22),0 2px 8px rgba(100,60,20,0.10);
  background:#2E0D0A;
  margin-bottom:22px;position:relative;
  animation:popIn .6s cubic-bezier(0.34,1.56,0.64,1) both;
}
.logo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
/* BRAND */
.brand-name{
  font-family:'Cormorant Garamond',serif;
  font-size:34px;font-weight:600;
  color:var(--ink);letter-spacing:0.02em;
  text-align:center;line-height:1;
  animation:fadeUp .6s .1s ease both;
}
.brand-sub{
  font-size:10px;font-weight:500;
  letter-spacing:0.32em;text-transform:uppercase;
  color:var(--ink-faint);
  margin-top:8px;text-align:center;
  animation:fadeUp .6s .15s ease both;
}
.socials{display:flex;gap:14px;margin:18px 0 30px;animation:fadeUp .6s .2s ease both}
.social-btn{
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,0.5);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;color:var(--gold);
  transition:background .2s,transform .2s;
}
.social-btn:hover{background:rgba(255,255,255,0.85);transform:scale(1.08)}
.social-btn svg{width:18px;height:18px}
.section-label{
  font-size:9px;font-weight:600;letter-spacing:0.4em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:15px;text-align:center;
  animation:fadeUp .6s .22s ease both;
}
/* CARDS */
.cards{width:100%;display:flex;flex-direction:column;gap:11px;margin-bottom:24px}
.card{
  display:flex;align-items:center;
  background:var(--card);border-radius:60px;
  text-decoration:none;color:var(--ink);
  transition:background .25s,transform .25s,box-shadow .25s;
  box-shadow:0 2px 12px rgba(120,80,40,0.13);
  overflow:hidden;padding:7px 18px 7px 7px;
}
.card:hover{background:var(--card-hover);transform:translateY(-2px);box-shadow:0 7px 20px rgba(120,80,40,0.20)}
.card:active{transform:translateY(0) scale(0.99)}
.card-thumb{
  width:54px;height:54px;border-radius:50%;
  flex-shrink:0;overflow:hidden;
  border:2px solid rgba(255,255,255,0.7);
  box-shadow:0 2px 8px rgba(100,60,20,0.14);
}
.card-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card-label{
  flex:1;text-align:center;
  font-family:'DM Sans',sans-serif;
  font-size:15px;font-weight:500;letter-spacing:0.03em;
  color:var(--ink);padding-right:6px;
}
.card-arrow{
  width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,0.45);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .2s;
}
.card:hover .card-arrow{background:rgba(255,255,255,0.7)}
.card-arrow svg{width:13px;height:13px}
.card:nth-child(1){animation:fadeUp .5s .28s ease both}
.card:nth-child(2){animation:fadeUp .5s .35s ease both}
.card:nth-child(3){animation:fadeUp .5s .42s ease both}
.card:nth-child(4){animation:fadeUp .5s .49s ease both}
.card:nth-child(5){animation:fadeUp .5s .56s ease both}
/* CTA */
.follow-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:16px 24px;background:var(--ink);color:var(--bg);
  border-radius:60px;text-decoration:none;
  font-size:10.5px;font-weight:600;letter-spacing:0.3em;text-transform:uppercase;
  transition:background .25s,transform .2s;
  animation:fadeUp .5s .62s ease both;
  box-shadow:0 5px 16px rgba(42,31,20,0.20);
}
.follow-btn:hover{background:#3D2B1A;transform:translateY(-2px)}
.follow-btn svg{width:16px;height:16px;flex-shrink:0}
/* FOOTER */
.footer{margin-top:34px;text-align:center;animation:fadeUp .5s .68s ease both}
.footer-dots{color:var(--gold);font-size:9px;letter-spacing:6px;margin-bottom:9px}
.footer-copy{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--ink-faint)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@media(max-width:360px){.brand-name{font-size:29px}.page{padding:42px 18px 50px}.card-label{font-size:14px}}
</style>
</head>
<body>
<main class="page">

<!-- LOGO: replace src with images/logo.jpg when ready -->

  <a href="https://www.instagram.com/the.lavenderhouse_/" target="_blank" rel="noopener" class="card">

  <a href="https://www.instagram.com/tulipgrovebygardenias/" target="_blank" rel="noopener" class="card">

<a href="https://www.instagram.com/thegardenias.asr/" target="_blank" rel="noopener" class="follow-btn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>

</body>
</html>
